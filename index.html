<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d0d0f">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>DUP Tracker</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230d0d0f'/%3E%3Crect x='10' y='27' width='44' height='10' rx='3' fill='%23c8d94f'/%3E%3Crect x='6' y='21' width='8' height='22' rx='3' fill='%23e8734a'/%3E%3Crect x='50' y='21' width='8' height='22' rx='3' fill='%234fc3d9'/%3E%3C/svg%3E">
<style>
  :root{
    --bg:#0d0d0f; --panel:#17171a; --line:#26262b; --line2:#2c2c32;
    --ink:#f2f0eb; --dim:#8a897f; --faint:#5c5c56;
    --heavy:#e8734a; --moderate:#c8d94f; --volume:#4fc3d9; --good:#6fd9a8; --warn:#e8b04a; --bad:#e0714f;
    --mono:ui-monospace,'SF Mono',Menlo,monospace;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg); color:var(--ink);
    font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
    -webkit-text-size-adjust:100%;
  }
  #app{max-width:560px;margin:0 auto;padding:28px 20px calc(60px + env(safe-area-inset-bottom))}
  h1{font-size:26px;font-weight:700;letter-spacing:-.02em;margin:0}
  h2{font-size:13px;font-family:var(--mono);letter-spacing:.12em;text-transform:uppercase;margin:0 0 12px}
  p{margin:0}
  button{font-family:inherit}
  .eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--dim)}
  .hero{font-size:40px;font-weight:800;letter-spacing:-.03em;margin:6px 0 26px}
  .head{display:flex;align-items:center;gap:12px;margin-bottom:10px}
  .back{background:none;border:none;color:var(--ink);font-size:24px;cursor:pointer;padding:4px;line-height:1}
  .row{display:flex;align-items:center;justify-content:space-between;gap:10px}
  .dim{color:var(--dim);font-size:13px;line-height:1.6}
  .card{display:block;width:100%;text-align:left;background:var(--panel);border:1px solid var(--line);
        border-radius:14px;padding:18px;margin-bottom:12px;cursor:pointer;color:inherit}
  .card.next{background:#1a1a1e}
  .card-title{font-size:19px;font-weight:700}
  .tag{font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;
       border:1px solid;padding:3px 7px;border-radius:5px;white-space:nowrap}
  .card-list{font-size:13px;line-height:1.5;margin-top:8px;color:var(--dim)}
  .flag{display:block;font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;margin-top:10px}
  .notice{border:1px solid;border-radius:12px;padding:16px;margin-bottom:18px}
  .notice strong{display:block;margin-bottom:6px}
  .ex{margin-bottom:26px;padding-bottom:20px;border-bottom:1px solid #1f1f23}
  .ex-name{font-size:17px;font-weight:700}
  .target{font-family:var(--mono);font-size:12px;white-space:nowrap}
  .set{display:flex;align-items:center;gap:10px;margin-top:10px}
  .setnum{font-family:var(--mono);font-size:12px;color:var(--faint);width:16px;flex:0 0 16px}
  input,textarea{
    background:var(--panel);border:1px solid var(--line2);border-radius:10px;color:var(--ink);
    font-size:18px;padding:12px 14px;min-width:0;font-family:var(--mono);width:100%
  }
  input:focus-visible,button:focus-visible,textarea:focus-visible{outline:2px solid var(--moderate);outline-offset:2px}
  .set input{flex:1}
  .unit{font-family:var(--mono);font-size:13px;color:var(--faint);width:20px;flex:0 0 20px}
  .timer{width:100%;background:none;border:1px solid var(--line2);color:var(--dim);border-radius:10px;
         padding:11px 0;font-size:14px;font-family:var(--mono);cursor:pointer;margin-top:12px}
  .rir-label{display:block;font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;
             color:var(--dim);margin:14px 0 8px}
  .rir-wrap{display:flex;gap:6px}
  .rir{flex:1;background:var(--panel);border:1px solid var(--line2);color:var(--ink);border-radius:8px;
       padding:10px 0;font-size:15px;font-family:var(--mono);cursor:pointer;min-width:44px}
  .rir.on{color:#0d0d0f}
  .primary{width:100%;color:#0d0d0f;border:none;border-radius:12px;padding:18px;font-size:16px;
           font-weight:700;cursor:pointer;margin-top:8px}
  .ghost{flex:1;background:none;border:1px solid var(--line2);color:var(--ink);border-radius:10px;
         padding:13px 16px;font-size:14px;cursor:pointer}
  .footer{display:flex;gap:10px;margin-top:10px}
  .edit-card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:10px}
  .name-input{background:none;border:none;border-bottom:1px solid var(--line2);font-size:16px;font-weight:600;
              padding:4px 0 8px;margin-bottom:12px;border-radius:0;font-family:inherit}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(72px,1fr));gap:8px;margin-bottom:12px}
  .field{display:flex;flex-direction:column;gap:4px}
  .field span{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim)}
  .field input{background:var(--bg);font-size:15px;padding:9px 8px;border-radius:8px}
  .check{font-size:13px;color:var(--dim);display:flex;align-items:center;cursor:pointer}
  .check input{width:auto;margin-right:8px}
  .icon{background:none;border:none;color:var(--dim);font-size:13px;cursor:pointer;padding:6px 8px}
  .icon:disabled{opacity:.3}
  .hist{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:10px}
  .hist-row{display:flex;gap:10px;font-size:13px;margin-top:8px;align-items:baseline}
  .verdict{font-family:var(--mono);font-size:12px;min-width:62px;text-align:right}
  textarea{font-size:12px;resize:vertical;margin-top:12px}
  svg.spark{width:100%;height:54px;margin-top:10px;display:block}
  .err{color:var(--bad);font-size:13px;margin-top:12px}
  .ok{color:var(--moderate);font-size:13px;margin-top:12px}
  @media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div id="app"></div>
<script>
(function(){
"use strict";

/* ============================================================
   Full-body DUP tracker — standalone build
   Mon heavy 5s / Wed moderate 8s / Fri volume 12s
   No network, no dependencies. Saves to this browser only.
============================================================ */

var KEY = "dup-tracker-v3";
var DELOAD_EVERY = 15;
var PER_WEEK = 3;

var ZONES = {
  heavy:    { label:"Heavy 5s",    accent:"var(--heavy)"    },
  moderate: { label:"Moderate 8s", accent:"var(--moderate)" },
  volume:   { label:"Volume 12s",  accent:"var(--volume)"   }
};

function uid(){ return Math.random().toString(36).slice(2,9); }
function r2h(n){ return Math.max(0, Math.round(n/2.5)*2.5); }
function fmt(n){ n=Number(n); return n%1===0 ? String(n) : n.toFixed(1); }
function esc(s){ return String(s).replace(/[&<>"']/g,function(c){
  return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]; }); }

function ex(name,sets,maxSets,repMin,repMax,weight,inc,inverse,rest){
  return { id:uid(), name:name, sets:sets, maxSets:maxSets, repMin:repMin, repMax:repMax,
           weight:weight, increment:inc, inverse:!!inverse, restSec:rest||120, missStreak:0 };
}

function defaults(){ return {
  sessions:[
    { id:"A", name:"Monday", zone:"heavy", exercises:[
      ex("Trap Bar Deadlift",4,5,4,6,60,5,false,180),
      ex("Barbell Military Press",4,5,4,6,32.5,2.5,false,150),
      ex("Chest-Supported Machine Row",4,5,6,8,45,2.5,false,120),
      ex("Leg Press",3,4,8,10,100,5,false,150),
      ex("Assisted Pull-Up",3,4,4,6,25,2.5,true,120),
      ex("Back Extension",2,3,12,15,0,2.5,false,90)
    ]},
    { id:"B", name:"Wednesday", zone:"moderate", exercises:[
      ex("Leg Press",4,5,8,10,90,5,false,150),
      ex("Assisted Dips",4,5,8,10,30,2.5,true,120),
      ex("Chest-Supported Machine Row",4,5,8,10,40,2.5,false,120),
      ex("Trap Bar Deadlift",3,4,8,10,50,5,false,150),
      ex("Assisted Pull-Up",3,4,8,10,32.5,2.5,true,120),
      ex("Back Extension",3,4,12,15,0,2.5,false,90)
    ]},
    { id:"C", name:"Friday", zone:"volume", exercises:[
      ex("Leg Press",4,5,12,15,75,5,false,120),
      ex("Barbell Military Press",3,4,12,15,22.5,2.5,false,120),
      ex("Chest-Supported Machine Row",4,5,12,15,32.5,2.5,false,90),
      ex("Assisted Dips",3,4,12,15,37.5,2.5,true,90),
      ex("Assisted Pull-Up",3,4,10,12,37.5,2.5,true,90),
      ex("Back Extension",3,4,15,20,0,2.5,false,90)
    ]}
  ],
  nextSession:"A", history:[], bodyweight:[], sessionCount:0, calibrated:false
};}

/* ---------- storage ---------- */
var state, storageOK = true;
function load(){
  try {
    var raw = localStorage.getItem(KEY);
    state = raw ? JSON.parse(raw) : defaults();
  } catch(e){ state = defaults(); storageOK = false; }
}
function save(){
  try { localStorage.setItem(KEY, JSON.stringify(state)); }
  catch(e){ storageOK = false; flash("Couldn't save. Export a backup from the Data screen before closing.", true); }
}

/* ---------- block position ---------- */
function week(){ return Math.min(Math.floor(state.sessionCount/PER_WEEK)+1, 5); }
function deloadDue(){ return state.sessionCount >= DELOAD_EVERY; }
function setsFor(e){
  if (deloadDue()) return Math.max(1, Math.round(e.sets*2/3));
  return Math.min(e.sets + (week()-1), e.maxSets || e.sets);
}

/* ---------- progression ---------- */
function workedWeight(logged, fallback){
  var vals = logged.map(function(s){ return Number(s.weight); }).filter(function(v){ return !isNaN(v); });
  if (!vals.length) return fallback;
  var counts = {}, best = vals[0];
  vals.forEach(function(v){ counts[v] = (counts[v]||0)+1; });
  Object.keys(counts).forEach(function(k){
    var v = Number(k);
    if (counts[v] > counts[best] || (counts[v] === counts[best] && v > best)) best = v;
  });
  return best;
}
function stepFrom(base, e, n){ return r2h(base + e.increment * n * (e.inverse ? -1 : 1)); }

function progress(e, logged, rir){
  var reps = logged.map(function(s){ return Number(s.reps)||0; });
  if (!reps.length) return { weight:e.weight, missStreak:e.missStreak, verdict:"skipped", worked:e.weight };
  var worked = workedWeight(logged, e.weight);
  var top = (e.repMax === null) ? e.repMin : e.repMax;
  var allTop = reps.every(function(r){ return r >= top; });
  var anyBelow = reps.some(function(r){ return r < e.repMin; });
  var r = (rir === undefined || rir === null || rir === "") ? 2 : Number(rir);

  if (allTop){
    var jumps = r >= 3 ? 2 : 1;
    return { weight:stepFrom(worked,e,jumps), missStreak:0, verdict:jumps===2?"up2":"up", worked:worked };
  }
  if (anyBelow){
    if (e.missStreak >= 1) return { weight:stepFrom(worked,e,-1), missStreak:0, verdict:"down", worked:worked };
    return { weight:worked, missStreak:1, verdict:"hold", worked:worked };
  }
  return { weight:worked, missStreak:0, verdict:"hold", worked:worked };
}

/* ---------- calibration maths ---------- */
function e1rm(w,reps,rir){ return w * (1 + (Number(reps)+Number(rir))/30); }
function loadForReps(max,target){ return max / (1 + (Number(target)+2)/30); }
function assistForReps(assist,reps,rir,target){ return r2h(assist + (Number(target)+2-Number(reps)-Number(rir))*2.5); }

function repLabel(e,sets){
  if (e.repMax === null) return sets + " \u00d7 AMRAP";
  if (e.repMin === e.repMax) return sets + " \u00d7 " + e.repMin;
  return sets + " \u00d7 " + e.repMin + "\u2013" + e.repMax;
}

/* ---------- view state ---------- */
var view = "home", activeId = null, draft = {}, rirs = {}, confirmSkip = false, msg = null, msgBad = false;
var timerHandle = null, timerLeft = null, timerEl = null;

function flash(text, bad){ msg = text; msgBad = !!bad; render(); }
function go(v){ view = v; msg = null; confirmSkip = false; stopTimer(); render(); }

/* ---------- sparkline ---------- */
function spark(points, color){
  if (points.length < 2) return "<p class='dim'>Not enough data yet.</p>";
  var w=300,h=54,p=4, min=Math.min.apply(null,points), max=Math.max.apply(null,points), span=(max-min)||1;
  var d = points.map(function(v,i){
    var x = p + (i/(points.length-1))*(w-p*2);
    var y = h - p - ((v-min)/span)*(h-p*2);
    return x.toFixed(1)+","+y.toFixed(1);
  }).join(" ");
  return "<svg class='spark' viewBox='0 0 "+w+" "+h+"' role='img' aria-label='Trend line'>"+
         "<polyline points='"+d+"' fill='none' stroke='"+color+"' stroke-width='2' "+
         "stroke-linejoin='round' stroke-linecap='round'/></svg>";
}

/* ---------- rest timer ---------- */
function stopTimer(){ if (timerHandle) clearInterval(timerHandle); timerHandle=null; timerLeft=null; timerEl=null; }
function mmss(s){ return Math.floor(s/60)+":"+String(s%60).padStart(2,"0"); }
function startTimer(el, secs){
  stopTimer();
  timerEl = el; timerLeft = secs;
  el.textContent = mmss(secs) + " \u2014 tap to stop";
  el.style.borderColor = "var(--moderate)"; el.style.color = "var(--moderate)";
  timerHandle = setInterval(function(){
    timerLeft--;
    if (timerLeft <= 0){
      clearInterval(timerHandle); timerHandle = null;
      el.textContent = "Rest done";
      el.style.background = "var(--moderate)"; el.style.color = "#0d0d0f";
      if (navigator.vibrate) navigator.vibrate([200,100,200]);
      return;
    }
    el.textContent = mmss(timerLeft) + " \u2014 tap to stop";
  }, 1000);
}
function resetTimerBtn(el, secs){
  el.textContent = "Rest " + mmss(secs);
  el.style.background = "none"; el.style.borderColor = "var(--line2)"; el.style.color = "var(--dim)";
}

/* ---------- session lifecycle ---------- */
function startSession(id){
  var s = find(id);
  draft = {}; rirs = {};
  s.exercises.forEach(function(e){
    var n = setsFor(e), arr = [];
    for (var i=0;i<n;i++) arr.push({ reps:"", weight:e.weight });
    draft[e.id] = arr;
  });
  activeId = id; view = "log"; confirmSkip = false; msg = null;
  render();
}
function find(id){ return state.sessions.filter(function(s){ return s.id===id; })[0]; }

function finish(){
  var s = find(activeId);
  var total = s.exercises.length;
  var done = s.exercises.filter(function(e){
    return (draft[e.id]||[]).some(function(r){ return r.reps !== ""; });
  }).length;
  if (done < total/2 && !confirmSkip){ confirmSkip = true; render(); return; }

  var entries = [];
  s.exercises = s.exercises.map(function(e){
    var logged = (draft[e.id]||[]).filter(function(r){ return r.reps !== ""; });
    if (!logged.length){
      entries.push({ name:e.name, sets:[], verdict:"skipped", from:e.weight, to:e.weight });
      return e;
    }
    var p = progress(e, logged, rirs[e.id]);
    entries.push({ name:e.name, sets:logged, verdict:p.verdict, from:p.worked, to:p.weight });
    e.weight = p.weight; e.missStreak = p.missStreak;
    return e;
  });

  var order = state.sessions.map(function(x){ return x.id; });
  var i = order.indexOf(s.id);
  state.nextSession = order[(i+1)%order.length];
  state.sessionCount++;
  state.history.unshift({ date:new Date().toISOString(), sessionId:s.id, week:week(), deload:deloadDue(), entries:entries });
  state.history = state.history.slice(0,120);
  save();
  activeId = null; view = "home"; confirmSkip = false; stopTimer();
  render();
}

/* ================= render ================= */
var app = document.getElementById("app");

function render(){
  var html;
  if (view === "log") html = viewLog();
  else if (view === "edit") html = viewEdit();
  else if (view === "history") html = viewHistory();
  else if (view === "progress") html = viewProgress();
  else if (view === "calibrate") html = viewCalibrate();
  else if (view === "data") html = viewData();
  else html = viewHome();
  app.innerHTML = html + (msg ? "<p class='"+(msgBad?"err":"ok")+"'>"+esc(msg)+"</p>" : "");
  window.scrollTo(0,0);
}

function header(title, accent){
  return "<div class='head'><button class='back' data-act='home' aria-label='Back'>\u2190</button>"+
         "<h1"+(accent?" style='color:"+accent+"'":"")+">"+esc(title)+"</h1></div>";
}

/* ---------- home ---------- */
function viewHome(){
  var h = "<p class='eyebrow'>Daily undulating \u00b7 full body</p><h1 class='hero'>Up next</h1>";

  if (!storageOK){
    h += "<div class='notice' style='border-color:#4a2620;background:#1a1210'>"+
         "<strong style='color:var(--bad)'>This browser isn't saving</strong>"+
         "<span class='dim'>Private browsing blocks storage. Open this page in a normal tab or nothing will persist.</span></div>";
  }
  if (!state.calibrated){
    h += "<div class='notice' style='border-color:#4a4322;background:#1c1a12'>"+
         "<strong>Loads aren't calibrated yet</strong>"+
         "<span class='dim'>One hard set per lift sets every zone at once. About ten minutes.</span>"+
         "<button class='ghost' style='margin-top:12px' data-act='calibrate'>Calibrate loads</button></div>";
  }
  if (deloadDue()){
    h += "<div class='notice' style='border-color:#4a4322;background:#1c1a12'>"+
         "<strong>Deload week due</strong>"+
         "<span class='dim'>Sets drop to two-thirds automatically. Keep the loads, stop 3\u20134 reps shy on everything.</span>"+
         "<button class='ghost' style='margin-top:12px' data-act='cleardeload'>Deload done \u2014 start new block</button></div>";
  }

  var bw = state.bodyweight;
  var trend = bw.length >= 2 ? bw[0].kg - bw[bw.length-1].kg : null;
  var held = state.history.slice(0,3).some(function(x){
    return x.entries.some(function(e){ return e.verdict === "hold"; }); });
  if (held && trend !== null && trend < -0.4){
    h += "<div class='notice' style='border-color:#2a4038;background:#101a17'>"+
         "<strong style='color:var(--good)'>Holding load on less bodyweight</strong>"+
         "<span class='dim'>Down "+fmt(Math.abs(trend))+" kg since you started logging, with loads holding. That's progress, not a stall.</span></div>";
  }

  state.sessions.forEach(function(s){
    var z = ZONES[s.zone], isNext = s.id === state.nextSession;
    h += "<button class='card"+(isNext?" next":"")+"' data-act='start' data-id='"+s.id+"'"+
         (isNext?" style='border-color:"+z.accent+"'":"")+">"+
         "<div class='row'><span class='card-title'>"+esc(s.name)+"</span>"+
         "<span class='tag' style='color:"+z.accent+";border-color:"+z.accent+"'>"+z.label+"</span></div>"+
         "<p class='card-list'>"+esc(s.exercises.map(function(e){return e.name;}).join(" \u00b7 ") || "No exercises yet")+"</p>"+
         (isNext ? "<span class='flag' style='color:"+z.accent+"'>Start this one</span>" : "")+
         "</button>";
  });

  h += "<p class='dim' style='margin-top:18px'>Week "+week()+" of 5 \u00b7 session "+state.sessionCount+
       " of "+DELOAD_EVERY+" this block"+
       (deloadDue() ? " \u00b7 deload" : (week()>1 ? " \u00b7 +"+(week()-1)+" set where the cap allows" : ""))+"</p>";

  h += "<div class='footer'><button class='ghost' data-act='edit'>Program</button>"+
       "<button class='ghost' data-act='progress'>Progress</button></div>"+
       "<div class='footer'><button class='ghost' data-act='history'>History</button>"+
       "<button class='ghost' data-act='data'>Data</button></div>";
  return h;
}

/* ---------- log ---------- */
function viewLog(){
  var s = find(activeId), z = ZONES[s.zone];
  var h = header(s.name, z.accent) +
    "<p class='eyebrow' style='margin-bottom:24px'>"+z.label+" \u00b7 week "+week()+(deloadDue()?" \u00b7 deload":"")+"</p>";

  s.exercises.forEach(function(e){
    var rows = draft[e.id] || [];
    h += "<div class='ex'><div class='row'><span class='ex-name'>"+esc(e.name)+"</span>"+
         "<span class='target' style='color:"+z.accent+"'>"+repLabel(e,rows.length)+" \u00b7 "+
         (e.weight===0 ? "BW" : fmt(e.weight)+" kg")+(e.inverse&&e.weight>0?" assist":"")+"</span></div>";
    rows.forEach(function(row,i){
      h += "<div class='set'><span class='setnum'>"+(i+1)+"</span>"+
           "<input inputmode='numeric' placeholder='reps' value='"+esc(row.reps)+"' "+
           "data-k='reps' data-e='"+e.id+"' data-i='"+i+"' aria-label='"+esc(e.name)+" set "+(i+1)+" reps'>"+
           "<input inputmode='decimal' value='"+esc(row.weight)+"' "+
           "data-k='weight' data-e='"+e.id+"' data-i='"+i+"' aria-label='"+esc(e.name)+" set "+(i+1)+" kilograms'>"+
           "<span class='unit'>kg</span></div>";
    });
    h += "<button class='timer' data-act='timer' data-secs='"+e.restSec+"'>Rest "+mmss(e.restSec)+"</button>";
    h += "<span class='rir-label'>Reps left in the tank on your last set</span><div class='rir-wrap'>";
    [0,1,2,3,4].forEach(function(n){
      var on = rirs[e.id] === n;
      h += "<button class='rir"+(on?" on":"")+"' data-act='rir' data-e='"+e.id+"' data-n='"+n+"'"+
           (on?" style='background:"+z.accent+";border-color:"+z.accent+"'":"")+">"+(n===4?"4+":n)+"</button>";
    });
    h += "</div></div>";
  });

  if (confirmSkip){
    h += "<p class='dim' style='color:var(--warn);margin-bottom:10px'>Most of this session is blank. "+
         "Unlogged lifts keep their current load and won't move either way. Tap again to finish.</p>";
  }
  h += "<button class='primary' data-act='finish' style='background:"+(confirmSkip?"var(--warn)":z.accent)+"'>"+
       (confirmSkip ? "Finish anyway" : "Finish and set next targets")+"</button>";
  return h;
}

/* ---------- edit ---------- */
function viewEdit(){
  var h = header("Program") +
    "<p class='dim'>Each day carries its own load for a lift \u2014 that separation is what makes the undulation work, "+
    "so edit them per day. Base sets are week 1; one set is added per week up to the cap. "+
    "Tick assist for machines where progress means <em>less</em> weight.</p>";

  state.sessions.forEach(function(s){
    var z = ZONES[s.zone];
    h += "<div style='margin-bottom:34px'><h2 style='margin-top:26px;color:"+z.accent+"'>"+
         esc(s.name)+" \u00b7 "+z.label+"</h2>";
    s.exercises.forEach(function(e,i){
      h += "<div class='edit-card'>"+
        "<input class='name-input' value='"+esc(e.name)+"' data-f='name' data-s='"+s.id+"' data-e='"+e.id+"' aria-label='Exercise name'>"+
        "<div class='grid'>"+
          fld("Base sets",e.sets,"sets",s.id,e.id)+
          fld("Set cap",e.maxSets,"maxSets",s.id,e.id)+
          fld("Min reps",e.repMin,"repMin",s.id,e.id)+
          fld("Max reps",(e.repMax===null?"":e.repMax),"repMax",s.id,e.id,"AMRAP")+
          fld("Load kg",e.weight,"weight",s.id,e.id)+
          fld("Step kg",e.increment,"increment",s.id,e.id)+
          fld("Rest sec",e.restSec,"restSec",s.id,e.id)+
        "</div>"+
        "<div class='row'><label class='check'><input type='checkbox' data-f='inverse' data-s='"+s.id+"' data-e='"+e.id+"'"+
          (e.inverse?" checked":"")+">Assist machine</label><div>"+
          "<button class='icon' data-act='up' data-s='"+s.id+"' data-e='"+e.id+"'"+(i===0?" disabled":"")+" aria-label='Move up'>\u2191</button>"+
          "<button class='icon' data-act='down' data-s='"+s.id+"' data-e='"+e.id+"'"+(i===s.exercises.length-1?" disabled":"")+" aria-label='Move down'>\u2193</button>"+
          "<button class='icon' style='color:var(--bad)' data-act='rm' data-s='"+s.id+"' data-e='"+e.id+"'>Remove</button>"+
        "</div></div></div>";
    });
    h += "<button class='ghost' data-act='add' data-s='"+s.id+"'>+ Add exercise to "+esc(s.name)+"</button></div>";
  });
  return h;
}
function fld(label,val,f,sid,eid,ph){
  return "<label class='field'><span>"+label+"</span>"+
         "<input inputmode='decimal' value='"+esc(val)+"'"+(ph?" placeholder='"+ph+"'":"")+
         " data-f='"+f+"' data-s='"+sid+"' data-e='"+eid+"'></label>";
}

/* ---------- calibrate ---------- */
var calVals = {};
function uniqueLifts(){
  var out = [];
  state.sessions.forEach(function(s){ s.exercises.forEach(function(e){
    if (!out.some(function(n){ return n.name === e.name; }))
      out.push({ name:e.name, inverse:e.inverse, bw:(e.weight===0 && !e.inverse) });
  });});
  return out;
}
function viewCalibrate(){
  var h = header("Calibrate loads") +
    "<p class='dim'>For each lift, do one honest hard set \u2014 any rep count \u2014 then enter what you used, "+
    "the reps you got, and how many more you could have done. Every zone across all three days is derived from that. "+
    "Bodyweight-only movements are skipped.</p>"+
    "<p class='dim' style='color:var(--warn);margin-top:10px'>These are estimates, not measurements. "+
    "Expect the first fortnight to correct itself as you log real sessions.</p>";

  uniqueLifts().filter(function(n){ return !n.bw; }).forEach(function(n){
    var v = calVals[n.name] || {};
    h += "<div class='edit-card'><div class='ex-name' style='margin-bottom:10px'>"+esc(n.name)+"</div><div class='grid'>"+
      "<label class='field'><span>"+(n.inverse?"Assist kg":"Load kg")+"</span><input inputmode='decimal' value='"+esc(v.weight||"")+"' data-c='weight' data-name='"+esc(n.name)+"'></label>"+
      "<label class='field'><span>Reps</span><input inputmode='numeric' value='"+esc(v.reps||"")+"' data-c='reps' data-name='"+esc(n.name)+"'></label>"+
      "<label class='field'><span>Reps left</span><input inputmode='numeric' value='"+esc(v.rir||"")+"' data-c='rir' data-name='"+esc(n.name)+"'></label>"+
      "</div></div>";
  });
  h += "<button class='primary' style='background:var(--moderate)' data-act='applycal'>Set every zone from these</button>";
  return h;
}
function applyCal(){
  state.sessions.forEach(function(s){ s.exercises.forEach(function(e){
    var v = calVals[e.name];
    if (!v || v.weight === undefined || v.reps === undefined) return;
    var w = Number(v.weight), reps = Number(v.reps), rir = Number(v.rir||0);
    if (isNaN(w) || isNaN(reps) || !reps) return;
    var target = (e.repMax === null) ? e.repMin : e.repMax;
    e.weight = e.inverse ? assistForReps(w,reps,rir,target) : r2h(loadForReps(e1rm(w,reps,rir), target));
    e.missStreak = 0;
  });});
  state.calibrated = true; save();
  view = "home"; msg = "Loads set. Log your first session and it will self-correct from there."; msgBad = false;
  render();
}

/* ---------- progress ---------- */
function viewProgress(){
  var h = header("Progress");
  h += "<h2 style='color:var(--good)'>Bodyweight</h2>"+
       "<div style='display:flex;gap:8px;margin-bottom:10px'>"+
       "<input inputmode='decimal' placeholder='kg' id='bwin' aria-label='Bodyweight in kilograms' style='flex:1'>"+
       "<button class='ghost' style='flex:0 0 auto;padding:13px 20px' data-act='logbw'>Log</button></div>";
  var bwPts = state.bodyweight.slice().reverse().map(function(b){ return b.kg; });
  h += bwPts.length > 1 ? spark(bwPts,"#6fd9a8") : "<p class='dim'>Log it weekly. Two points and a line appears.</p>";

  h += "<h2 style='color:var(--moderate);margin-top:30px'>Working load by lift</h2>";
  uniqueLifts().forEach(function(n){
    var pts = [];
    state.history.slice().reverse().forEach(function(x){
      x.entries.forEach(function(e){
        if (e.name === n.name && e.sets.length && !isNaN(Number(e.from))) pts.push(Number(e.from));
      });
    });
    h += "<div class='hist'><div class='row'><span class='ex-name'>"+esc(n.name)+"</span>"+
         "<span class='dim'>"+(n.inverse ? "lower is stronger" : (pts.length ? fmt(pts[pts.length-1])+" kg" : ""))+"</span></div>"+
         spark(pts, n.inverse ? "#e8734a" : "#c8d94f")+"</div>";
  });
  return h;
}

/* ---------- history ---------- */
var VTEXT = { up:"load up", up2:"load up \u00d72", down:"back a step", hold:"held", skipped:"skipped" };
var VCOL  = { up:"var(--moderate)", up2:"var(--moderate)", down:"var(--bad)", hold:"var(--dim)", skipped:"var(--faint)" };
function viewHistory(){
  var h = header("History");
  if (!state.history.length) h += "<p class='dim'>Nothing logged yet. Finish a session and it lands here.</p>";
  state.history.forEach(function(x){
    var s = find(x.sessionId);
    h += "<div class='hist'><div class='row'><span class='ex-name'>"+
         esc(s ? s.name : x.sessionId)+(x.deload?" \u00b7 deload":"")+"</span>"+
         "<span class='dim' style='color:"+(s?ZONES[s.zone].accent:"var(--dim)")+"'>"+
         new Date(x.date).toLocaleDateString("en-AU",{day:"numeric",month:"short"})+"</span></div>";
    x.entries.forEach(function(e){
      h += "<div class='hist-row'><span style='flex:1'>"+esc(e.name)+"</span>"+
           "<span class='dim'>"+(e.sets.map(function(y){return y.reps;}).join("/") || "\u2014")+"</span>"+
           "<span class='verdict' style='color:"+VCOL[e.verdict]+"'>"+
           ((e.verdict==="hold"||e.verdict==="skipped") ? VTEXT[e.verdict] : fmt(e.to)+" kg")+"</span></div>";
    });
    h += "</div>";
  });
  return h;
}

/* ---------- data ---------- */
function viewData(){
  return header("Data") +
    "<p class='dim'>Everything is stored in this browser only \u2014 clearing site data wipes it. "+
    "Download a backup after any session you'd hate to lose.</p>"+
    "<div class='footer'><button class='ghost' data-act='download'>Download backup</button>"+
    "<button class='ghost' data-act='pickfile'>Restore from file</button></div>"+
    "<input type='file' id='filein' accept='.json,application/json' style='display:none'>"+
    "<textarea id='ta' rows='7' placeholder=\"Or paste backup text here and tap Restore from text.\"></textarea>"+
    "<div class='footer'><button class='ghost' data-act='copytext'>Copy to text box</button>"+
    "<button class='ghost' data-act='importtext'>Restore from text</button></div>"+
    "<button class='ghost' style='margin-top:24px;width:100%;border-color:#4a2620;color:var(--bad)' data-act='reset'>"+
    "Reset to the starting program</button>";
}

/* ================= events ================= */
app.addEventListener("input", function(ev){
  var t = ev.target;
  if (t.dataset.k){                       // logging a set
    var arr = draft[t.dataset.e];
    if (arr && arr[t.dataset.i]) arr[t.dataset.i][t.dataset.k] = t.value;
  } else if (t.dataset.c){                // calibration
    var n = t.dataset.name;
    calVals[n] = calVals[n] || {};
    calVals[n][t.dataset.c] = t.value;
  }
});

app.addEventListener("change", function(ev){
  var t = ev.target, f = t.dataset.f;
  if (!f) return;
  var s = find(t.dataset.s);
  if (!s) return;
  var e = s.exercises.filter(function(x){ return x.id === t.dataset.e; })[0];
  if (!e) return;
  if (f === "name") e.name = t.value;
  else if (f === "inverse") e.inverse = t.checked;
  else if (f === "repMax") e.repMax = (t.value === "" ? null : Number(t.value));
  else if (f === "sets" || f === "maxSets") e[f] = Math.max(1, Number(t.value)||1);
  else if (f === "increment") e.increment = Number(t.value) || 2.5;
  else if (f === "restSec") e.restSec = Number(t.value) || 90;
  else e[f] = Number(t.value) || 0;
  save();
});

app.addEventListener("click", function(ev){
  var b = ev.target.closest("button");
  if (!b) return;
  var a = b.dataset.act;
  if (!a) return;

  if (a === "home"){ activeId = null; go("home"); return; }
  if (a === "start"){ startSession(b.dataset.id); return; }
  if (a === "finish"){ finish(); return; }
  if (a === "edit" || a === "history" || a === "progress" || a === "data" || a === "calibrate"){ go(a); return; }
  if (a === "cleardeload"){ state.sessionCount = 0; save(); render(); return; }

  if (a === "rir"){
    rirs[b.dataset.e] = Number(b.dataset.n);
    render();
    return;
  }
  if (a === "timer"){
    var secs = Number(b.dataset.secs);
    if (timerEl === b && timerHandle){ stopTimer(); resetTimerBtn(b, secs); }
    else if (timerEl === b && timerLeft === 0){ stopTimer(); resetTimerBtn(b, secs); }
    else { if (timerEl) resetTimerBtn(timerEl, Number(timerEl.dataset.secs)); startTimer(b, secs); }
    return;
  }

  // program editing
  if (a === "add" || a === "rm" || a === "up" || a === "down"){
    var s = find(b.dataset.s);
    if (a === "add"){
      var p = { heavy:[4,4,6], moderate:[4,8,10], volume:[3,12,15] }[s.zone];
      s.exercises.push(ex("New exercise",p[0],p[0]+1,p[1],p[2],20,2.5,false,120));
    } else {
      var i = s.exercises.findIndex(function(x){ return x.id === b.dataset.e; });
      if (i < 0) return;
      if (a === "rm") s.exercises.splice(i,1);
      else {
        var j = i + (a === "up" ? -1 : 1);
        if (j < 0 || j >= s.exercises.length) return;
        var tmp = s.exercises[i]; s.exercises[i] = s.exercises[j]; s.exercises[j] = tmp;
      }
    }
    save(); render(); return;
  }

  if (a === "applycal"){ applyCal(); return; }

  if (a === "logbw"){
    var el = document.getElementById("bwin");
    var kg = Number(el.value);
    if (!kg || kg <= 0){ flash("Enter a weight in kg.", true); return; }
    state.bodyweight.unshift({ date:new Date().toISOString(), kg:kg });
    state.bodyweight = state.bodyweight.slice(0,120);
    save(); render(); return;
  }

  // data screen
  if (a === "download"){
    var blob = new Blob([JSON.stringify(state,null,2)], { type:"application/json" });
    var url = URL.createObjectURL(blob);
    var link = document.createElement("a");
    link.href = url;
    link.download = "dup-tracker-" + new Date().toISOString().slice(0,10) + ".json";
    document.body.appendChild(link); link.click(); document.body.removeChild(link);
    setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
    return;
  }
  if (a === "copytext"){ document.getElementById("ta").value = JSON.stringify(state); return; }
  if (a === "pickfile"){ document.getElementById("filein").click(); return; }
  if (a === "importtext"){ restore(document.getElementById("ta").value); return; }
  if (a === "reset"){
    if (b.dataset.armed){ state = defaults(); save(); go("home"); return; }
    b.dataset.armed = "1"; b.textContent = "Tap again to wipe everything";
    return;
  }
});

app.addEventListener("change", function(ev){
  if (ev.target.id !== "filein") return;
  var f = ev.target.files[0];
  if (!f) return;
  var reader = new FileReader();
  reader.onload = function(){ restore(reader.result); };
  reader.readAsText(f);
});

function restore(text){
  try {
    var p = JSON.parse(text);
    if (!p.sessions || !Array.isArray(p.sessions)) throw new Error("shape");
    state = p; save();
    view = "home"; msg = "Backup restored."; msgBad = false; render();
  } catch(e){
    flash("That isn't a valid backup. Paste the whole export, braces included.", true);
  }
}

/* ---------- installable ---------- */
try {
  var manifest = {
    name:"DUP Tracker", short_name:"DUP", start_url:".", display:"standalone",
    background_color:"#0d0d0f", theme_color:"#0d0d0f",
    icons:[{ src:"data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230d0d0f'/%3E%3Crect x='10' y='27' width='44' height='10' rx='3' fill='%23c8d94f'/%3E%3C/svg%3E",
              sizes:"any", type:"image/svg+xml", purpose:"any" }]
  };
  var mlink = document.createElement("link");
  mlink.rel = "manifest";
  mlink.href = URL.createObjectURL(new Blob([JSON.stringify(manifest)], { type:"application/manifest+json" }));
  document.head.appendChild(mlink);
} catch(e){ /* manifest is a nicety, not a requirement */ }

load();
render();
})();
</script>
